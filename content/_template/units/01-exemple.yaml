id: 01-exemple
order: 1
title: "Titre dans la langue"
title_fr: "Titre en français"
goal_fr: "Ce que l'enfant sait faire à la fin, en une phrase."
can_do_fr:
  - "Je sais ..."
duration_min: 12
vocab:
  # `translit` n'est utilisé que si has_transliteration: true (arabe, russe...)
  # `level: grands` limite un mot au niveau lecteur ; sans ce champ, le mot est pour tous.
  - { term: "مَرْحَبًا", translit: "marhaban", fr: "bonjour", phon: "mar-ha-BAN" }
phrases:
  - { term: "...", translit: "...", fr: "...", phon: "..." }
notes_fr:
  - "Une règle expliquée simplement. Le **gras** fonctionne."
activities:
  - level: petits
    type: jeu          # jeu | chanson | exercice | production
    title_fr: "Nom du jeu"
    steps_fr:
      - "Étape 1."
  - level: grands
    type: exercice
    title_fr: "Nom de l'exercice"
    steps_fr:
      - "Consigne 1."
year: 1              # année du programme (voir program.yaml)
# Le dialogue est le cœur de l'unité : l'enfant doit d'abord entendre une
# discussion entière avant qu'on démonte les mots.
dialogue:
  title_fr: "Titre de la scène"
  context_fr: "Où, quand, avec qui — une phrase."
  lines:
    - { who: "Ana",   term: "…", fr: "…", phon: "…" }
    - { who: "Tomás", term: "…", fr: "…", phon: "…" }
# Vérifie que l'ensemble a été compris, pas seulement des mots isolés.
comprehension:
  - q_fr: "Question en français sur le dialogue."
    a_fr: "La réponse, **gras** accepté."
# Le pas qui manque entre comprendre et parler : ce qu'on me demande,
# ce que je peux répondre. Plusieurs réponses = une vraie conversation.
qa:
  - question: { term: "…?", fr: "…", phon: "…" }
    answers:
      - { term: "…", fr: "…", phon: "…" }
      - { term: "…", fr: "…", phon: "…" }
# La langue ne sert que si elle sort du cours.
reemploi_fr:
  - "Ce qu'on utilise dans la vraie vie cette semaine."
