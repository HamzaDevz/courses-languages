# GABARIT du programme. Un parcours = un âge, avec son rythme et son niveau visé.
# Chaque unité citée doit exister dans units/. Supprimer ce fichier si la langue
# n'a pas encore de programme : le reste du cours fonctionne sans lui.
intro_fr: >
  En une phrase : combien de parcours, combien d'années, le fil conducteur.
