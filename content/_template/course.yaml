# GABARIT — copier ce dossier vers content/<code>/ pour créer une langue.
# Les dossiers commençant par "_" sont ignorés par le build.
code: ar
name: العربية
name_fr: Arabe
variant: MSA
variant_fr: Arabe standard moderne
direction: rtl            # l'arabe s'écrit de droite à gauche
script: arabic
has_transliteration: true # ajoute la colonne `translit` dans les tableaux
speech_lang: ar-SA
teaching_language: fr
note_fr: >
  Les mots sont écrits avec les voyelles (harakat) pour aider à la lecture.
  Commencer par l'alphabet avant le vocabulaire.
levels:
  - id: petits
    label_fr: 3-6 ans
    desc_fr: Pré-lecteurs. Écoute, répétition, jeux, images. Aucun écrit exigé.
  - id: grands
    label_fr: 7-10 ans
    desc_fr: Lecteurs. Tracé des lettres, fiches, premières règles.

# Voix utilisées par scripts/audio.py (deux voix : les dialogues sonnent à deux).
# Liste complète : python3 -m edge_tts --list-voices
voices:
  f: ar-SA-ZariyahNeural
  m: ar-SA-HamedNeural
speech_rate: "-10%"

# La boîte à outils : ce qu'on dit quand on ne comprend pas. Elle ne s'apprend
# pas dans une unité, elle sert toute l'année.
toolkit:
  - title_fr: "Quand je n'ai pas compris"
    intro_fr: "À savoir par cœur avant tout le reste."
    items:
      - { term: "…", translit: "…", fr: "Je n'ai pas compris.", phon: "…" }
      - { term: "…", translit: "…", fr: "Encore une fois, s'il te plaît.", phon: "…" }
