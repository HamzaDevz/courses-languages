id: 04-familia
order: 4
title: "A família"
title_fr: "La famille"
goal_fr: "Nommer les membres de la famille et les présenter."
can_do_fr:
  - "Je nomme les membres de ma famille en portugais."
  - "Je sais présenter quelqu'un : « voici ma sœur »."
duration_min: 15
vocab:
  - { term: "a mãe",     fr: "la maman",       phon: "a MAN-i (nasal)" }
  - { term: "o pai",     fr: "le papa",        phon: "ou païe" }
  - { term: "o irmão",   fr: "le frère",       phon: "ou ir-MAN-ou" }
  - { term: "a irmã",    fr: "la sœur",        phon: "a ir-MAN" }
  - { term: "o avô",     fr: "le grand-père",  phon: "ou a-VÔ" }
  - { term: "a avó",     fr: "la grand-mère",  phon: "a a-VO (o ouvert)" }
  - { term: "o filho",   fr: "le fils",        phon: "ou FI-liou" }
  - { term: "a filha",   fr: "la fille",       phon: "a FI-lia" }
  - { term: "o tio",     fr: "l'oncle",        phon: "ou TI-ou" }
  - { term: "a tia",     fr: "la tante",       phon: "a TI-a" }
  - { term: "o primo",   fr: "le cousin",      phon: "ou PRI-mou", level: grands }
  - { term: "a prima",   fr: "la cousine",     phon: "a PRI-ma", level: grands }
  - { term: "o bebé",    fr: "le bébé",        phon: "ou be-BÈ" }
phrases:
  - { term: "Esta é a minha mãe.",   fr: "Voici ma maman.",       phon: "ÈCH-ta è a MI-nia MAN-i" }
  - { term: "Este é o meu pai.",     fr: "Voici mon papa.",       phon: "ÈCH-te è ou méou païe" }
  - { term: "Tenho dois irmãos.",    fr: "J'ai deux frères.",     phon: "TÉ-niou doïch ir-MAN-ouch" }
  - { term: "Amo a minha família.",  fr: "J'aime ma famille.",    phon: "A-mou a MI-nia fa-MI-lia" }
notes_fr:
  - "Le mot vient presque toujours avec son petit mot devant : **o** pour le masculin, **a** pour le féminin. Apprenez toujours *o pai*, *a mãe* — jamais *pai* tout seul."
  - "*avô* (grand-père) et *avó* (grand-mère) ne diffèrent que par l'accent : **ô** = son fermé « o », **ó** = son ouvert « ò ». C'est le seul indice, il faut bien écouter."
  - "« mon / ma » se dit *o meu* (masc.) et *a minha* (fém.) : *o meu pai*, *a minha mãe*."
activities:
  - level: petits
    type: jeu
    title_fr: "L'album photo"
    steps_fr:
      - "Ouvrez un album ou le téléphone."
      - "Vous montrez une photo et dites *a mãe*, l'enfant répète."
      - "Puis vous montrez sans parler : c'est lui qui nomme."
  - level: petits
    type: chanson
    title_fr: "La ronde de la famille"
    steps_fr:
      - "Sur l'air de « Frère Jacques » : *O meu pai, o meu pai, a minha mãe, a minha mãe...*"
      - "Ajoutez un membre de la famille à chaque tour."
  - level: grands
    type: exercice
    title_fr: "Masculin ou féminin ?"
    steps_fr:
      - "Écris **o** ou **a** devant : ___ irmã, ___ avô, ___ primo, ___ tia, ___ pai, ___ filha."
  - level: grands
    type: production
    title_fr: "Mon arbre généalogique"
    steps_fr:
      - "Dessine ton arbre sur une feuille."
      - "Écris sous chaque personne son nom en portugais : *o avô João*, *a minha irmã Sara*..."
      - "Présente-le à voix haute : *Este é o meu avô. Esta é a minha irmã.*"
  - level: petits
    type: jeu
    title_fr: "Le memory de la famille"
    steps_fr:
      - "Imprimez ou photocopiez deux fois six photos de la famille. Collez-les sur du carton."
      - "Cartes retournées : on cherche les paires. On ne garde la paire que si on dit qui c'est — *o avô!*"
      - "Trop difficile à six paires ? Commencez à quatre."
  - level: petits
    type: jeu
    title_fr: "Qui a dit ça ?"
    steps_fr:
      - "Imitez la voix de quelqu'un de la famille en disant une petite phrase portugaise connue."
      - "L'enfant devine : *é o pai!*, *é a avó!*"
      - "À son tour d'imiter. C'est le moment de la séance où l'on rit le plus."
  - level: grands
    type: jeu
    title_fr: "Qui est-ce ? version famille"
    steps_fr:
      - "Étalez douze photos de famille sur la table. Chacun en choisit une en secret."
      - "On pose des questions fermées, en portugais : *É um homem? Tem óculos? É o teu irmão?*"
      - "Le premier qui devine gagne. Les règles complètes sont dans la **boîte à jeux**."
  - level: grands
    type: jeu
    title_fr: "Le dé de la famille"
    steps_fr:
      - "Fabriquez un dé en papier avec six membres de la famille, un par face."
      - "On lance et on dit **deux phrases** sur la personne tirée : *Esta é a minha tia. Tem dois filhos.*"
      - "Difficile : la deuxième phrase doit contenir un nombre."
year: 1
dialogue:
  title_fr: "C'est ma famille"
  context_fr: "Tomás montre une photo de famille à Ana."
  lines:
    - { who: "Tomás", term: "Olha, esta é a minha família.",   fr: "Regarde, ça c'est ma famille.",        phon: "O-lia, ÈCH-ta è a MI-gna fa-MI-lia" }
    - { who: "Ana",   term: "Quem é este?",                    fr: "C'est qui, lui ?",                      phon: "kèïn è ÈCH-te" }
    - { who: "Tomás", term: "É o meu pai. Chama-se João.",     fr: "C'est mon papa. Il s'appelle João.",    phon: "è ou méou paï. CHA-ma-se jouan-ou" }
    - { who: "Ana",   term: "E esta menina?",                  fr: "Et cette petite fille ?",               phon: "i ÈCH-ta me-NI-na" }
    - { who: "Tomás", term: "É a minha irmã. Tem três anos.",  fr: "C'est ma sœur. Elle a trois ans.",      phon: "è a MI-gna ir-MAN. tèïn trèch A-nouch" }
    - { who: "Ana",   term: "Que giro! Tens irmãos?",          fr: "Qu'elle est mignonne ! Tu as des frères ?", phon: "ke JI-rou! tèïnch ir-MAN-ouch" }
    - { who: "Tomás", term: "Tenho um irmão e uma irmã.",      fr: "J'ai un frère et une sœur.",            phon: "TÉ-gnou oun ir-MAN-ou i OU-ma ir-MAN" }
comprehension:
  - q_fr: "Comment s'appelle le père de Tomás ?"
    a_fr: "João."
  - q_fr: "Combien de frères et sœurs a Tomás ?"
    a_fr: "Deux : **um irmão e uma irmã** (un frère et une sœur)."
  - q_fr: "Quel âge a sa sœur ?"
    a_fr: "Trois ans — *tem três anos*. Attention : pour quelqu'un d'autre, on dit **tem**, pas *tenho*."
  - q_fr: "Quelle phrase utilise Ana pour demander qui est sur la photo ?"
    a_fr: "**Quem é este?** — « c'est qui, lui ? ». Pour une fille : *Quem é esta?*"
qa:
  - question: { term: "Tens irmãos?", fr: "Tu as des frères et sœurs ?", phon: "tèïnch ir-MAN-ouch" }
    answers:
      - { term: "Tenho uma irmã.",    fr: "J'ai une sœur.",             phon: "TÉ-gnou OU-ma ir-MAN" }
      - { term: "Tenho dois irmãos.", fr: "J'ai deux frères.",          phon: "TÉ-gnou doïch ir-MAN-ouch" }
      - { term: "Não, sou filho único.", fr: "Non, je suis fils unique.", phon: "nan-ou, sô FI-liou OU-ni-kou" }
  - question: { term: "Quem é este?", fr: "Qui est-ce ?", phon: "kèïn è ÈCH-te" }
    answers:
      - { term: "É o meu pai.",  fr: "C'est mon papa.",  phon: "è ou méou paï" }
      - { term: "É a minha avó.", fr: "C'est ma grand-mère.", phon: "è a MI-gna a-VO" }
  - question: { term: "Como se chama a tua mãe?", fr: "Comment s'appelle ta maman ?", phon: "KO-mou se CHA-ma a TOU-a maïn" }
    answers:
      - { term: "Chama-se Maria.", fr: "Elle s'appelle Maria.", phon: "CHA-ma-se ma-RI-a" }
      - { term: "Não sei dizer.",  fr: "Je ne sais pas le dire.", phon: "nan-ou sèï di-ZÈR" }
reemploi_fr:
  - "Nommer en portugais chaque membre de la famille qui entre dans la pièce : *o pai*, *a mãe*, *o irmão*."
  - "Devant l'album photo du week-end, demander : *Quem é este?*"
cefr: "A1.1"
culture_fr: >-
  Les grands-parents (*os avós*) ont une place centrale dans les familles portugaises, et gardent souvent les petits-enfants. Attention à l'oreille : **avó** (a-VO, la grand-mère) et **avô** (a-VÔ, le grand-père) ne diffèrent que par la voyelle.
