id: 06-comida
order: 6
title: "À mesa"
title_fr: "À table"
goal_fr: "Nommer les aliments, dire qu'on a faim ou soif, demander poliment."
can_do_fr:
  - "Je nomme les aliments du quotidien."
  - "Je sais dire que j'ai faim, soif, et demander quelque chose poliment."
duration_min: 15
vocab:
  - { term: "a água",   fr: "l'eau",      phon: "a A-goua" }
  - { term: "o pão",    fr: "le pain",    phon: "ou pan-ou (nasal)" }
  - { term: "o leite",  fr: "le lait",    phon: "ou LÉÏ-te" }
  - { term: "a maçã",   fr: "la pomme",   phon: "a ma-SAN (nasal)" }
  - { term: "a banana", fr: "la banane",  phon: "a ba-NA-na" }
  - { term: "o queijo", fr: "le fromage", phon: "ou KÉÏ-jou" }
  - { term: "a sopa",   fr: "la soupe",   phon: "a SÔ-pa" }
  - { term: "o arroz",  fr: "le riz",     phon: "ou a-RROCH" }
  - { term: "o peixe",  fr: "le poisson", phon: "ou PÉÏ-che" }
  - { term: "o bolo",   fr: "le gâteau",  phon: "ou BÔ-lou" }
  - { term: "a fruta",  fr: "le fruit",   phon: "a FROU-ta" }
  - { term: "o sumo",   fr: "le jus",     phon: "ou SOU-mou" }
phrases:
  - { term: "Tenho fome.",          fr: "J'ai faim.",            phon: "TÉ-niou FO-me" }
  - { term: "Tenho sede.",          fr: "J'ai soif.",            phon: "TÉ-niou SÉ-de" }
  - { term: "Quero água, por favor.", fr: "Je veux de l'eau, s'il te plaît.", phon: "KÈ-rou A-goua, pour fa-VOR" }
  - { term: "Está bom!",            fr: "C'est bon !",           phon: "chta bon" }
  - { term: "Bom apetite!",         fr: "Bon appétit !",         phon: "bon a-pe-TI-te" }
notes_fr:
  - "Comme pour l'âge, on **a** faim et soif : *tenho fome*, *tenho sede*."
  - "Au Portugal on dit *o sumo* pour le jus ; au Brésil on dit *o suco*. Les deux existent, ce cours utilise le portugais du Portugal."
  - "Petite politesse portugaise : on ajoute très souvent *se faz favor* (= *por favor*) à la fin de la demande."
activities:
  - level: petits
    type: jeu
    title_fr: "Le vrai petit-déjeuner"
    steps_fr:
      - "Au vrai petit-déjeuner, nommez chaque chose en portugais avant de la poser sur la table."
      - "L'enfant ne reçoit l'aliment que s'il le demande : *pão, por favor!*"
  - level: petits
    type: jeu
    title_fr: "La dînette portugaise"
    steps_fr:
      - "Jouez au restaurant avec la dînette."
      - "Le serveur demande *Bom dia! O que queres?*, le client répond *Quero sopa, por favor.*"
  - level: grands
    type: exercice
    title_fr: "Fome ou sede ?"
    steps_fr:
      - "Il est midi, tu n'as rien mangé → *Tenho ______ .*"
      - "Tu reviens du sport, il fait chaud → *Tenho ______ .*"
      - "Écris ensuite ce que tu demandes dans chaque cas."
  - level: grands
    type: production
    title_fr: "Le menu du jour"
    steps_fr:
      - "Écris le menu d'un restaurant en portugais : entrée, plat, dessert, boisson."
      - "Joue la scène : quelqu'un commande, tu prends la commande."
year: 1
dialogue:
  title_fr: "À table"
  context_fr: "Le soir, à la maison. La mère de Tomás sert le dîner."
  lines:
    - { who: "Mãe",   term: "Tomás, tens fome?",              fr: "Tomás, tu as faim ?",             phon: "tou-MACH, tèïnch FO-me" }
    - { who: "Tomás", term: "Tenho muita fome!",              fr: "J'ai très faim !",                phon: "TÉ-gnou MOUÏN-ta FO-me" }
    - { who: "Mãe",   term: "O que queres comer?",            fr: "Qu'est-ce que tu veux manger ?",  phon: "ou ke KÈ-rech kou-MÈR" }
    - { who: "Tomás", term: "Quero sopa, por favor.",         fr: "Je veux de la soupe, s'il te plaît.", phon: "KÈ-rou SO-pa, pour fa-VOR" }
    - { who: "Mãe",   term: "E para beber?",                  fr: "Et pour boire ?",                 phon: "i pa-ra be-BÈR" }
    - { who: "Tomás", term: "Água, por favor. Tenho sede.",   fr: "De l'eau, s'il te plaît. J'ai soif.", phon: "A-goua, pour fa-VOR. TÉ-gnou SÉ-de" }
    - { who: "Mãe",   term: "Aqui tens. Bom apetite!",        fr: "Voilà. Bon appétit !",            phon: "a-KI tèïnch. bon a-pe-TI-te" }
    - { who: "Tomás", term: "Obrigado, mãe. Está bom!",       fr: "Merci, maman. C'est bon !",       phon: "o-bri-GA-dou, maïn. chta bon" }
comprehension:
  - q_fr: "Qu'est-ce que Tomás veut manger ?"
    a_fr: "De la soupe — *sopa*."
  - q_fr: "Qu'est-ce qu'il demande à boire, et pourquoi ?"
    a_fr: "De l'eau (*água*), parce qu'il a soif : *tenho sede*."
  - q_fr: "Quelles sont les deux formules de politesse qu'il emploie ?"
    a_fr: "**por favor** en demandant, **obrigado** en recevant."
  - q_fr: "Comment dit-on « j'ai faim » ? Que faut-il retenir ?"
    a_fr: "*Tenho fome.* En portugais on **a** la faim, comme en français : jamais *sou fome*."
qa:
  - question: { term: "O que queres comer?", fr: "Qu'est-ce que tu veux manger ?", phon: "ou ke KÈ-rech kou-MÈR" }
    answers:
      - { term: "Quero pão, por favor.",   fr: "Je veux du pain, s'il te plaît.", phon: "KÈ-rou pan-ou, pour fa-VOR" }
      - { term: "Quero fruta.",            fr: "Je veux des fruits.",             phon: "KÈ-rou FROU-ta" }
      - { term: "Não quero nada, obrigado.", fr: "Je ne veux rien, merci.",       phon: "nan-ou KÈ-rou NA-da, o-bri-GA-dou" }
  - question: { term: "Tens fome ou tens sede?", fr: "Tu as faim ou tu as soif ?", phon: "tèïnch FO-me ô tèïnch SÉ-de" }
    answers:
      - { term: "Tenho fome.", fr: "J'ai faim.", phon: "TÉ-gnou FO-me" }
      - { term: "Tenho sede.", fr: "J'ai soif.", phon: "TÉ-gnou SÉ-de" }
  - question: { term: "Está bom?", fr: "C'est bon ?", phon: "chta bon" }
    answers:
      - { term: "Está muito bom!",     fr: "C'est très bon !",       phon: "chta MOUÏN-tou bon" }
      - { term: "Não gosto muito.",    fr: "Je n'aime pas trop.",    phon: "nan-ou GOCH-tou MOUÏN-tou" }
reemploi_fr:
  - "Tout le repas se demande en portugais cette semaine : *água, por favor*, *quero pão*, *está bom!*"
  - "Avant de commencer à manger, quelqu'un dit *Bom apetite!* — et tout le monde répond."
