id: 01-ola
order: 1
title: "Olá!"
title_fr: "Bonjour !"
goal_fr: "Saluer, dire merci, dire son nom."
can_do_fr:
  - "Je sais dire bonjour selon le moment de la journée."
  - "Je sais dire merci et s'il te plaît."
  - "Je sais dire mon nom et demander celui de l'autre."
duration_min: 12
vocab:
  - { term: "olá",            fr: "salut",                     phon: "o-LA" }
  - { term: "bom dia",        fr: "bonjour (le matin)",        phon: "bon DI-a" }
  - { term: "boa tarde",      fr: "bonjour (l'après-midi)",    phon: "boa TAR-de" }
  - { term: "boa noite",      fr: "bonsoir / bonne nuit",      phon: "boa NOÏ-te" }
  - { term: "adeus",          fr: "au revoir",                 phon: "a-DÉOUCH" }
  - { term: "sim",            fr: "oui",                       phon: "sïn (nasal)" }
  - { term: "não",            fr: "non",                       phon: "nan-ou (nasal)" }
  - { term: "por favor",      fr: "s'il te plaît",             phon: "pour fa-VOR" }
  - { term: "obrigado",       fr: "merci (dit par un garçon)", phon: "o-bri-GA-dou" }
  - { term: "obrigada",       fr: "merci (dit par une fille)", phon: "o-bri-GA-da" }
  - { term: "de nada",        fr: "de rien",                   phon: "de NA-da" }
phrases:
  - { term: "Como te chamas?", fr: "Comment t'appelles-tu ?",  phon: "KO-mou te CHA-mach" }
  - { term: "Chamo-me Léo.",   fr: "Je m'appelle Léo.",        phon: "CHA-mou-me Léo" }
  - { term: "Tudo bem?",       fr: "Ça va ?",                  phon: "TOU-dou bèïn" }
  - { term: "Estou bem, obrigado.", fr: "Je vais bien, merci.", phon: "chtô bèïn, o-bri-GA-dou" }
notes_fr:
  - "**obrigado / obrigada** : en portugais, on accorde le merci avec **celui qui parle**, pas avec la personne remerciée. Un garçon dit toujours *obrigado*, une fille toujours *obrigada*."
  - "Au Portugal, le **s** en fin de mot se prononce « ch » : *adeus* → « adéouch »."
activities:
  - level: petits
    type: jeu
    title_fr: "Le réveil et le dodo"
    steps_fr:
      - "Mimez le lever du soleil : tout le monde dit *bom dia*."
      - "Mimez l'après-midi (on joue dehors) : *boa tarde*."
      - "Éteignez la lumière : *boa noite*, et on fait semblant de dormir."
      - "Recommencez de plus en plus vite : l'enfant doit trouver la bonne salutation."
  - level: petits
    type: jeu
    title_fr: "La marionnette qui dit merci"
    steps_fr:
      - "Donnez un objet à l'enfant en disant *por favor*."
      - "Il répond *obrigado* ou *obrigada* selon qu'il est garçon ou fille."
      - "Vous répondez *de nada*. Inversez les rôles."
  - level: grands
    type: exercice
    title_fr: "Complète le dialogue"
    steps_fr:
      - "— ______ , tudo bem ? (salut)"
      - "— Estou bem, ______ . (merci)"
      - "— Como te ______ ? (t'appelles)"
      - "— ______ -me ______ . (je m'appelle + ton prénom)"
  - level: grands
    type: production
    title_fr: "Ta carte de présentation"
    steps_fr:
      - "Écris 3 phrases en portugais : une salutation, ton nom, et *adeus*."
      - "Lis-les à voix haute en écoutant l'audio du site pour corriger ta prononciation."
  - level: grands
    type: dialogue
    title_fr: "Rejoue la scène, change le prénom"
    steps_fr:
      - "Rejoue le dialogue en prenant le rôle de Tomás, puis celui d'Ana."
      - "Refais-le avec **ton** prénom et celui d'un ami."
      - "Ajoute une réplique à la fin : *Até amanhã!* (à demain)."
  - level: petits
    type: jeu
    title_fr: "La porte magique"
    steps_fr:
      - "Tenez la porte du salon fermée avec la main. Pour passer, il faut dire la salutation qui va avec l'heure qu'il est **vraiment** : *bom dia* le matin, *boa tarde* l'après-midi."
      - "Salutation juste : la porte s'ouvre en grand. Salutation fausse : la porte grince et reste fermée, on réessaie."
      - "Refaites-le à chaque passage de la journée : c'est le même jeu, mais il dure une semaine."
  - level: petits
    type: mouvement
    title_fr: "Le mur du *sim* et le mur du *não*"
    steps_fr:
      - "Désignez deux murs de la pièce : l'un est *sim*, l'autre est *não*."
      - "Posez une question toute simple : *Tu és o Léo?*, *Tens um cão?*, *Gostas de bolo?*"
      - "L'enfant court au mur qui correspond à sa réponse, et la dit à voix haute en arrivant."
      - "Inversez : c'est lui qui pose les questions et vous qui courez. Trompez-vous exprès une fois sur trois."
  - level: grands
    type: jeu
    title_fr: "La chaîne des prénoms"
    steps_fr:
      - "Le premier dit *Chamo-me Ana.*"
      - "Le deuxième reprend et ajoute : *Esta é a Ana. Chamo-me Tomás.*"
      - "Le troisième reprend les deux et s'ajoute. On continue jusqu'à ce que quelqu'un se trompe."
      - "À plus de quatre, on tourne en rond : la chaîne recommence au début, mais plus vite."
  - level: grands
    type: bricolage
    title_fr: "Le badge *obrigado* / *obrigada*"
    steps_fr:
      - "Découpez un rond de carton. D'un côté écrivez **obrigado**, de l'autre **obrigada**."
      - "Portez-le une journée entière, du bon côté selon qui le porte."
      - "Celui qui dit merci en français doit retourner le badge de quelqu'un d'autre : à la fin, on compte les retournements."
year: 1
dialogue:
  title_fr: "Deux enfants se rencontrent"
  context_fr: "Le matin, devant l'école. Ana voit Tomás pour la première fois."
  lines:
    - { who: "Ana",   term: "Olá! Bom dia!",              fr: "Salut ! Bonjour !",              phon: "o-LA! bon DI-a" }
    - { who: "Tomás", term: "Bom dia! Tudo bem?",         fr: "Bonjour ! Ça va ?",              phon: "bon DI-a! TOU-dou bèïn" }
    - { who: "Ana",   term: "Estou bem, obrigada. E tu?", fr: "Je vais bien, merci. Et toi ?",  phon: "chtô bèïn, o-bri-GA-da. i TOU" }
    - { who: "Tomás", term: "Também estou bem.",          fr: "Moi aussi je vais bien.",        phon: "tan-BÈÏN chtô bèïn" }
    - { who: "Tomás", term: "Como te chamas?",            fr: "Comment t'appelles-tu ?",        phon: "KO-mou te CHA-mach" }
    - { who: "Ana",   term: "Chamo-me Ana. E tu?",        fr: "Je m'appelle Ana. Et toi ?",     phon: "CHA-mou-me A-na. i TOU" }
    - { who: "Tomás", term: "Chamo-me Tomás. Adeus, Ana!", fr: "Je m'appelle Tomás. Au revoir, Ana !", phon: "CHA-mou-me tou-MACH. a-DÉOUCH, A-na" }
    - { who: "Ana",   term: "Adeus, Tomás!",              fr: "Au revoir, Tomás !",             phon: "a-DÉOUCH, tou-MACH" }
comprehension:
  - q_fr: "Comment s'appellent les deux enfants ?"
    a_fr: "Ana et Tomás."
  - q_fr: "Est-ce qu'ils vont bien tous les deux ?"
    a_fr: "Oui : chacun répond **estou bem**, et Tomás ajoute *também* (moi aussi)."
  - q_fr: "Ana dit *obrigada* et pas *obrigado*. Pourquoi ?"
    a_fr: "Parce que le merci s'accorde avec **celui qui parle** : une fille dit toujours *obrigada*."
  - q_fr: "Quelle petite phrase les deux enfants utilisent-ils pour renvoyer la question ?"
    a_fr: "**E tu?** — « et toi ? ». C'est elle qui transforme deux phrases en discussion."
qa:
  - question: { term: "Como te chamas?", fr: "Comment t'appelles-tu ?", phon: "KO-mou te CHA-mach" }
    answers:
      - { term: "Chamo-me Léo.",     fr: "Je m'appelle Léo.",            phon: "CHA-mou-me Léo" }
      - { term: "O meu nome é Ana.", fr: "Mon nom est Ana.",             phon: "ou méou NO-me è A-na" }
  - question: { term: "Tudo bem?", fr: "Ça va ?", phon: "TOU-dou bèïn" }
    answers:
      - { term: "Estou bem, obrigado.", fr: "Je vais bien, merci.",      phon: "chtô bèïn, o-bri-GA-dou" }
      - { term: "Mais ou menos.",       fr: "Couci-couça.",              phon: "maïz ou MÉ-nouch" }
      - { term: "Não estou bem.",       fr: "Je ne vais pas bien.",      phon: "nan-ou chtô bèïn" }
  - question: { term: "Bom dia! Como estás?", fr: "Bonjour ! Comment vas-tu ?", phon: "bon DI-a! KO-mou chTACH" }
    answers:
      - { term: "Bom dia! Estou bem.", fr: "Bonjour ! Je vais bien.",    phon: "bon DI-a! chtô bèïn" }
      - { term: "Olá! E tu?",          fr: "Salut ! Et toi ?",           phon: "o-LA! i TOU" }
reemploi_fr:
  - "Toute la semaine, on dit **bom dia** au réveil et **boa noite** au coucher, à la place du français."
  - "Chaque fois qu'on passe quelque chose à table : *por favor* — *obrigado* — *de nada*."
cefr: "A1.1"
culture_fr: >-
  Au Portugal, on se salue avec **deux bises** (*dois beijinhos*), même entre enfants qui se connaissent peu. *Bom dia* s'utilise jusqu'au déjeuner, *boa tarde* après — et *boa noite* sert à la fois pour « bonsoir » en arrivant et « bonne nuit » en partant.
