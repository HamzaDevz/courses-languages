    answers:
      - { term: "اسْمِي يُوسُف.",      translit: "ismī Yūsuf.",       fr: "Je m'appelle Youssef.",  phon: "is-MI you-SOUF" }
      - { term: "أَنا مَرْيَم.",        translit: "anā Maryam.",       fr: "Moi, c'est Maryam.",     phon: "A-na MAR-yam" }
  - question: { term: "كَيْفَ حالُك؟", translit: "kayfa ḥāluk?", fr: "Comment vas-tu ?", phon: "KAÏ-fa HA-louk" }
    answers:
      - { term: "أَنا بِخَيْر، الحَمْدُ لِلَّه.", translit: "anā bi-khayr, al-ḥamdu li-llāh.", fr: "Je vais bien, louange à Dieu.", phon: "A-na bi-KHAÏR, al-HAM-dou lil-LAH" }
      - { term: "بِخَيْر، شُكْرًا.",    translit: "bi-khayr, shukran.", fr: "Bien, merci.",          phon: "bi-KHAÏR, CHOU-kran" }
      - { term: "لَسْتُ بِخَيْر.",      translit: "lastu bi-khayr.",   fr: "Je ne vais pas bien.",   phon: "LAS-tou bi-KHAÏR" }
  - question: { term: "السَّلامُ عَلَيْكُم!", translit: "as-salāmu ʿalaykum!", fr: "La paix sur toi !", phon: "as-sa-LA-mou 'a-LAÏ-koum" }
    answers:
      - { term: "وَعَلَيْكُمُ السَّلام!", translit: "wa ʿalaykumu s-salām!", fr: "Et sur toi la paix !", phon: "wa 'a-LAÏ-kou-mou s-sa-LAM" }
      - { term: "وَعَلَيْكُمُ السَّلام، أَهْلًا!", translit: "wa ʿalaykumu s-salām, ahlan!", fr: "Et sur toi la paix, salut !", phon: "wa 'a-LAÏ-kou-mou s-sa-LAM, AH-lan" }
reemploi_fr:
  - "Toute la semaine, on dit **السَّلامُ عَلَيْكُم** en entrant dans une pièce, à la place du bonjour français."
  - "À table, chaque fois qu'on se passe quelque chose : مِنْ فَضْلِك — شُكْرًا — عَفْوًا."
culture_fr: >-
  **السَّلامُ عَلَيْكُم ne veut pas dire « bonjour » : ça veut dire « que la paix
  soit sur toi ».** C'est un souhait, pas un mot — c'est pourquoi on y répond en
  le rendant, et souvent en l'augmentant. Ce salut se dit de l'Atlantique à
  l'Indonésie, entre gens qui ne partagent aucune autre langue : c'est
  probablement la phrase arabe la plus prononcée au monde.
